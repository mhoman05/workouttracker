*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{

  --nav-h:64px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
  --r:14px;--rs:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 16px)}
.screen.nonav{padding-bottom:32px}
.pad{padding:0 16px 16px}
.ptop{padding-top:calc(var(--safe-top) + 14px)}
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bot));background:rgba(28,28,30,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;color:var(--sub)}
.nav-btn.active{color:var(--blue)}.nav-icon{font-size:22px;line-height:1}.nav-lbl{font-size:10px;letter-spacing:.2px}
.bkhdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:.5px solid var(--border);background:rgba(13,13,13,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.bkhdr-back{color:var(--blue);background:none;border:none;cursor:pointer;font-size:17px;padding:4px 0;display:flex;align-items:center;gap:2px;min-width:60px}
.bkhdr-title{font-size:16px;font-weight:600;text-align:center;flex:1}
.bkhdr-right{min-width:60px;display:flex;justify-content:flex-end}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.ci{padding:14px 16px}
.btn{border:none;border-radius:var(--rs);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.72}
.btn-blue{background:var(--blue-bg);color:var(--blue)}.btn-green{background:var(--green-bg);color:var(--green)}
.btn-ghost{background:var(--card);color:var(--sub);border:.5px solid var(--border)}
.btn-red{background:var(--red-bg);color:var(--red)}.btn-purple{background:var(--purple-bg);color:var(--purple)}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:8px}
input[type=number],input[type=text],input[type=password],textarea{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:10px;outline:none}
input[type=number]{font-size:24px;font-weight:700;text-align:center;width:100%;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]:focus,input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--blue)}
input[type=text],input[type=password]{font-size:14px;width:100%}
textarea{font-size:13px;width:100%;resize:vertical;line-height:1.5;min-height:100px}
select{background:var(--card);border:.5px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px;padding:12px;width:100%;outline:none}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-blue{background:var(--blue-bg);color:var(--blue)}.tag-green{background:var(--green-bg);color:var(--green)}
.tag-orange{background:var(--orange-bg);color:var(--orange)}.tag-purple{background:var(--purple-bg);color:var(--purple)}
.chip{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:2px}
.chip-work{background:var(--green-bg);color:var(--green)}.chip-warm{background:rgba(142,142,147,.12);color:var(--sub)}
.chip-del{background:none;border:none;cursor:pointer;font-size:14px;padding:0 4px;line-height:1}
.equip-chip{padding:7px 12px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer;margin:3px}
.equip-chip.sel{border-color:var(--blue-bd);background:var(--blue-bg);color:var(--blue)}
.bubble{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1.5px solid var(--dim);color:var(--dim)}
.bubble.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.sec{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--sub);text-transform:uppercase;margin:18px 0 8px;padding:0 2px;display:flex;align-items:center;gap:6px}
.between{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:8px}
.stickhdr{position:sticky;top:0;background:rgba(13,13,13,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:50;border-bottom:.5px solid var(--border);padding:12px 16px}
.restbanner{background:var(--orange-bg);border:.5px solid var(--orange-bd);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.progbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:10px}
.progfill{height:100%;background:var(--blue);border-radius:2px;transition:width .4s}
.wakebadge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,214,10,.1);border:.5px solid rgba(255,214,10,.25);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;color:var(--yellow)}
.note-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(74,158,255,.08);color:var(--blue);border:.5px solid var(--blue-bd);border-radius:10px;padding:4px 10px;font-size:11px;margin-top:8px;width:100%;cursor:pointer}
.tsel{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tsel-btn{padding:8px;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--sub);cursor:pointer}
.tsel-btn.sel{border-color:var(--blue-bd);background:var(--blue-bg);color:var(--blue)}
.tsel-btn.selw{border-color:rgba(142,142,147,.4);background:rgba(142,142,147,.1);color:var(--sub)}
.ex-row-edit{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--border)}
.ex-row-edit:last-child{border-bottom:none}
.tog{width:28px;height:28px;border-radius:50%;border:1.5px solid;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;background:none}
.tog.on{border-color:var(--green);color:var(--green)}.tog.off{border-color:var(--dim);color:var(--dim)}
.sumscreen{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:48px 20px 40px;display:flex;flex-direction:column;align-items:center}
.sumstat{background:var(--card);border-radius:var(--r);padding:16px;text-align:center}
.resumebanner{background:rgba(74,158,255,.08);border:1px solid var(--blue-bd);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:flex;align-items:flex-end}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--safe-bot));width:100%;max-height:85vh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.toggle{width:50px;height:28px;border-radius:14px;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green)}.toggle.off{background:var(--dim)}
.toggle-knob{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle.on .toggle-knob{left:24px}.toggle.off .toggle-knob{left:2px}
.cat-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cat-tab{padding:10px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--sub);font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.cat-tab.active{border-color:var(--purple-bd);background:var(--purple-bg);color:var(--purple)}
.prompt-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;font-size:12px;color:var(--sub);line-height:1.6;white-space:pre-wrap;max-height:200px;overflow-y:auto;word-break:break-all}
.parsed-preview{background:rgba(48,209,88,.06);border:1px solid var(--green-bd);border-radius:var(--rs);padding:14px;margin-top:12px}
h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.empty{text-align:center;padding:60px 20px;color:var(--sub);font-size:15px;line-height:1.8}
.notion-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(74,158,255,.08);border:.5px solid var(--blue-bd);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--blue)}

</head>

// nFetch — uses your Cloudflare Worker URL as the API base
const nFetch=async(method,path,body,token,workerUrl)=>{
  if(!workerUrl)throw new Error('No proxy configured. Set up your Cloudflare Worker in Settings.');
  // Strip any invisible/non-ASCII characters that break HTTP headers (common copy-paste issue)
  const tok=(token||'').replace(/[^\x20-\x7E]/g,'').trim();
  const base=(workerUrl||'').replace(/[^\x20-\x7E]/g,'').trim().replace(/\/$/,'');
  if(!tok)throw new Error('API token is empty — paste it again in Settings.');
  if(!base)throw new Error('Worker URL is empty — paste it in Settings.');
  const url=base+'/v1'+path;
  const res=await fetch(url,{method,
    headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json','Notion-Version':'2022-06-28'},
    body:body?JSON.stringify(body):undefined});
  let d;try{d=await res.json();}catch{d={};}
  if(!res.ok)throw new Error(d.message||(res.status===401?'Invalid token — check your API key':res.status===404?'Database not found — check the ID':'Notion error '+res.status));
  return d;
};
const chunkRT=(s,n=1990)=>{const r=[];for(let i=0;i<s.length;i+=n)r.push({type:'text',text:{content:s.slice(i,i+n)}});return r;};
const syncLog=async(log,ns)=>{
  const{token,dbId,workerUrl}=ns;const dayName=getDayName(log);
  const working=Object.values(log.exercises).reduce((s,a)=>s+a.filter(x=>!x.warmup).length,0);
  const warms=Object.values(log.exercises).reduce((s,a)=>s+a.filter(x=>x.warmup).length,0);
  const exLines=Object.entries(log.exercises).map(([exId,sets])=>{
    const ex=ALL_EX.find(e=>e.id===exId);
    const ws=sets.filter(s=>!s.warmup),wm=sets.filter(s=>s.warmup);
    let l=(ex?.name||exId)+': ';
    if(wm.length)l+='[W: '+wm.map(s=>s.weight?s.weight+'×'+s.reps:'BW×'+s.reps).join(', ')+'] ';
    return l+ws.map(s=>s.weight?s.weight+'kg×'+s.reps:'BW×'+s.reps).join(', ');
  }).join('\n');
  const topLifts=Object.entries(log.exercises).map(([exId,sets])=>{
    const ws=sets.filter(s=>!s.warmup&&s.weight>0);if(!ws.length)return null;
    const ex=ALL_EX.find(e=>e.id===exId);const max=Math.max(...ws.map(s=>s.weight));
    return(ex?.name||exId)+' '+max+'kg×'+ws.find(s=>s.weight===max)?.reps;
  }).filter(Boolean).slice(0,4).join(', ');
  const noteText=Object.entries(log.notes||{}).filter(([,n])=>n).map(([exId,n])=>(ALL_EX.find(e=>e.id===exId)?.name||exId)+': '+n).join('\n');
  const title=dayName+' · '+new Date(log.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  await nFetch('POST','/pages',{parent:{database_id:dbId},properties:{
    'Workout':{title:[{text:{content:title}}]},'Date':{date:{start:log.date}},'Day':{select:{name:dayName}},
    'Duration (min)':{number:Math.round(log.dur/60)},'Working Sets':{number:working},'Warmup Sets':{number:warms},
    'Top Lifts':{rich_text:[{text:{content:topLifts}}]},'Exercises':{rich_text:[{text:{content:exLines.substring(0,1990)}}]},
    'Notes':{rich_text:[{text:{content:noteText.substring(0,1990)}}]},'App ID':{rich_text:[{text:{content:log.id}}]},
    'Synced From':{select:{name:'PWA'}},
  },children:[{object:'block',type:'code',code:{language:'json',rich_text:chunkRT(JSON.stringify(log))}}]},token,workerUrl);
};
const importFromNotion=async(ns)=>{
  const{token,dbId,workerUrl}=ns;let all=[],cursor;
  do{const body={sorts:[{property:'Date',direction:'ascending'}],page_size:100};
    if(cursor)body.start_cursor=cursor;
    const d=await nFetch('POST',`/databases/${dbId}/query`,body,token,workerUrl);
    all=all.concat(d.results);cursor=d.has_more?d.next_cursor:undefined;
  }while(cursor);
  const imported=[];
  for(const page of all){try{const blocks=await nFetch('GET',`/blocks/${page.id}/children`,null,token,workerUrl);const cb=blocks.results.find(b=>b.type==='code');if(cb){const s=cb.code.rich_text.map(r=>r.text.content).join('');imported.push(JSON.parse(s));}}catch{}}
  return imported;
};

};
